<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game · ROBLOX CCU Tracker</title>
<meta name="description" content="Live concurrent player count, history and details for a tracked Roblox game.">
<meta name="theme-color" content="#0b0d17">

<!-- This exact file is copied into every games/<placeId>/ folder by
     scripts/sync-games.mjs — it never differs between games. Everything
     shown below is worked out at runtime from the URL and the live data. -->
<script>window.SITE_ROOT = "../../";</script>

<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="../../favicon.png">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">

<script src="https://cdn.tailwindcss.com"></script>
<script src="../../tailwind-config.js"></script>

<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-straight/css/uicons-regular-straight.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../../site.css">
</head>
<body class="min-h-screen flex flex-col bg-roblox-darkBg text-slate-100 antialiased selection:bg-roblox-bgs selection:text-black">

<div id="site-header"></div>

<main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

  <a id="back" href="../../games" class="inline-flex items-center gap-1.5 text-sm text-slate-400 hover:text-white transition-colors">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m0 0 6 6m-6-6 6-6"/></svg>
    All games
  </a>

  <div id="notice" class="hidden bg-amber-400/10 border border-amber-400/30 text-amber-200 text-sm rounded-xl px-4 py-3"></div>

  <!-- Shown only if the id in the URL doesn't match a tracked game. -->
  <div id="notFound" class="hidden bg-roblox-cardBg border border-roblox-cardBorder rounded-2xl p-8 text-center space-y-2">
    <p class="text-lg font-semibold text-white">Game not found</p>
    <p class="text-sm text-slate-400">This game isn't tracked (or was removed). <a href="../../games" class="text-roblox-bgs hover:underline">Back to all games</a></p>
  </div>

  <article id="page" class="hidden game-card tile bg-roblox-cardBg rounded-2xl p-5 sm:p-8 flex flex-col gap-5 overflow-hidden">
    <div class="art"></div>

    <div class="flex items-start justify-between gap-3">
      <div class="flex items-center gap-4 min-w-0">
        <img id="icon" src="" alt="" class="tile-icon w-20 h-20 rounded-2xl object-cover shadow-md bg-slate-900 shrink-0">
        <div class="min-w-0">
          <span id="tag" class="tile-tag text-xs font-semibold uppercase tracking-wider px-2.5 py-0.5 rounded-full">—</span>
          <h1 id="name" class="text-xl sm:text-2xl font-bold mt-1 text-white drop-shadow leading-snug break-words">—</h1>
          <a id="link" href="#" target="_blank" rel="noopener"
             class="tile-link text-xs text-slate-300 inline-flex items-center gap-1 mt-0.5 transition-colors">
            Open on Roblox <i class="fi fi-rr-arrow-up-right-from-square text-[10px]"></i>
          </a>
        </div>
      </div>
      <span id="rating" class="hidden shrink-0 items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-lg bg-slate-900/80 border border-slate-800 text-slate-200" title="Roblox like ratio">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tile-accent" aria-hidden="true"><path d="M7 10v11H3V10h4zm0 0 4-8a2.5 2.5 0 0 1 2.5 2.5V8H19a2 2 0 0 1 2 2.3l-1.3 8A2 2 0 0 1 17.7 20H7"/></svg>
        <span id="ratingValue">—</span>
      </span>
    </div>

    <div class="bg-slate-900/80 rounded-xl p-4 border border-slate-800 backdrop-blur-sm">
      <div class="flex justify-between items-center gap-2 text-xs text-slate-400 font-medium uppercase tracking-wider">
        <span>Players in game</span>
        <span id="trend" class="normal-case tracking-normal font-semibold"></span>
      </div>
      <div class="tile-ccu text-4xl sm:text-5xl font-extrabold tracking-tight tabular-nums mt-1" id="ccu">—</div>
      <div class="mt-3">
        <div class="spark h-24" id="spark"></div>
        <div class="flex justify-between text-[10px] text-slate-500 mt-1">
          <span>24h ago</span><span>now</span>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
      <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-800/40">
        <span class="text-slate-400 block mb-0.5"><i class="fi fi-rr-chat-arrow-grow tile-accent mr-1"></i>24h peak</span>
        <span class="font-bold text-slate-200 tabular-nums" id="peak24">—</span>
      </div>
      <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-800/40">
        <span class="text-slate-400 block mb-0.5"><i class="fi fi-rr-chat-arrow-grow text-amber-400 mr-1"></i>7d peak</span>
        <span class="font-bold text-slate-200 tabular-nums" id="peak7">—</span>
      </div>
      <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-800/40">
        <span class="text-slate-400 block mb-0.5"><i class="fi fi-rs-eye tile-accent mr-1"></i>Visits</span>
        <span class="font-bold text-slate-200 tabular-nums" id="visits">—</span>
      </div>
      <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-800/40">
        <span class="text-slate-400 block mb-0.5"><i class="fi fi-rr-star text-amber-400 mr-1"></i>Favourites</span>
        <span class="font-bold text-slate-200 tabular-nums" id="favs">—</span>
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-3 border-t border-slate-800/80 text-xs">
      <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-800/40">
        <span class="text-slate-400 block mb-0.5"><i class="fi fi-rr-flag tile-accent mr-1"></i>Created</span>
        <span class="font-bold text-slate-200" id="created">—</span>
      </div>
      <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-800/40">
        <span class="text-slate-400 block mb-0.5"><i class="fi fi-rr-refresh tile-accent mr-1"></i>Last updated</span>
        <span class="font-bold text-slate-200" id="updated">—</span>
      </div>
      <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-800/40">
        <span class="text-slate-400 block mb-0.5"><i class="fi fi-rr-user tile-accent mr-1"></i>Owner</span>
        <span class="font-bold text-slate-200" id="owner">—</span>
      </div>
    </div>
  </article>

</main>

<div id="site-footer"></div>

<script src="../../config.js"></script>
<script src="../../site.js"></script>
<script>
(() => {
  "use strict";

  const { byPlaceId, $, fmt, setText, iconFor, iconFallback, dateLabel, ROOT } = Tracker;
  Tracker.mountChrome("games");

  const HOUR = 3600 * 1000;
  const DAY = 24 * HOUR;

  // The id is the last path segment: .../games/<id>/ (trailing slash) or
  // .../games/<id> before GitHub Pages redirects it to add the slash.
  const segments = location.pathname.replace(/\/+$/, "").split("/");
  const gameId = segments[segments.length - 1];
  const game = byPlaceId.get(gameId);

  if (!game) {
    $("notFound").classList.remove("hidden");
  } else {
    $("page").classList.remove("hidden");
    document.title = `${game.label} · ROBLOX CCU Tracker`;

    $("page").style.setProperty("--accent", game.accent);
    $("page").style.setProperty("--rgb", game.rgb);
    $("page").style.setProperty("--thumb", `url('${ROOT}assets/${game.slug}-thumbnail.png')`);

    $("tag").textContent = game.short;
    $("name").textContent = game.label;
    $("name").title = game.label;
    $("link").href = game.url;

    const icon = $("icon");
    icon.alt = game.label + " icon";
    icon.src = iconFor(game.slug);
    icon.dataset.fallback = "0";
    icon.addEventListener("error", () => {
      const step = Number(icon.dataset.fallback || "0");
      if (step === 0) { icon.dataset.fallback = "1"; icon.src = `${ROOT}assets/${game.slug}-icon.png`; }
      else { icon.src = iconFallback; }
    });

    let latest = null;
    let history = [];

    function paintLive(payload) {
      const data = (payload.games || []).find((g) => g.slug === game.slug);
      if (!data) return;
      latest = data;

      setText($("ccu"), fmt(data.playing));
      $("peak24").textContent = fmt(data.peak24h);
      $("peak7").textContent = fmt(data.peak7d);
      $("visits").textContent = fmt(data.visits);
      $("favs").textContent = fmt(data.favorites);
      $("created").textContent = dateLabel(data.createdAt);
      $("updated").textContent = dateLabel(data.updatedAt);

      const owner = $("owner");
      if (data.creatorId && data.creatorType) {
        const href = data.creatorType === "Group"
          ? `https://www.roblox.com/groups/${data.creatorId}/`
          : `https://www.roblox.com/users/${data.creatorId}/profile`;
        owner.innerHTML = `<a href="${href}" target="_blank" rel="noopener" class="tile-link inline-flex items-center gap-1 transition-colors">${data.creator || "—"} <i class="fi fi-rr-arrow-up-right-from-square text-[9px]"></i></a>`;
      } else {
        owner.textContent = data.creator || "—";
      }

      if (typeof data.ratingPercent === "number") {
        $("ratingValue").textContent = data.ratingPercent + "%";
        $("rating").classList.remove("hidden");
        $("rating").classList.add("inline-flex");
      }

      if (data.iconUrl) icon.src = data.iconUrl;
      if (data.liveName) { $("name").textContent = data.liveName; $("name").title = data.liveName; }

      if (payload.source === "database") {
        $("notice").textContent = payload.warning || "Roblox did not respond — showing the last stored reading.";
        $("notice").classList.remove("hidden");
      } else {
        $("notice").classList.add("hidden");
      }

      paintTrend();
    }

    function sparkline(points) {
      const W = 600, H = 96, PAD = 6;
      const minX = Date.now() - DAY;
      const ys = points.map((p) => p.y);
      const lo = Math.min(...ys), hi = Math.max(...ys);
      const margin = (hi - lo) * 0.15 || hi * 0.1 || 1;
      const yMin = Math.max(0, lo - margin), yMax = hi + margin;

      const xOf = (t) => Math.min(W, Math.max(0, ((t - minX) / DAY) * W));
      const yOf = (v) => PAD + (H - PAD * 2) * (1 - (v - yMin) / (yMax - yMin));

      const line = points.map((p, i) => `${i ? "L" : "M"}${xOf(p.x).toFixed(1)} ${yOf(p.y).toFixed(1)}`).join(" ");
      const first = points[0], last = points[points.length - 1];
      const area = `${line} L${xOf(last.x).toFixed(1)} ${H} L${xOf(first.x).toFixed(1)} ${H} Z`;

      return `
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="sg-page" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="${game.accent}" stop-opacity="0.32"/>
              <stop offset="1" stop-color="${game.accent}" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="${area}" fill="url(#sg-page)"/>
          <path d="${line}" fill="none" stroke="${game.accent}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        </svg>
        <span class="spark-dot" style="left:${(xOf(last.x) / W * 100).toFixed(2)}%;top:${(yOf(last.y) / H * 100).toFixed(2)}%"></span>`;
    }

    function paintSpark() {
      const host = $("spark");
      host.innerHTML = history.length >= 2
        ? sparkline(history)
        : `<div class="h-full flex items-center justify-center text-xs text-slate-500">Collecting history…</div>`;
    }

    function paintTrend() {
      const el = $("trend");
      if (!history.length || !latest) { el.textContent = ""; return; }
      const target = Date.now() - HOUR;
      let nearest = history[0];
      for (const p of history) if (Math.abs(p.x - target) < Math.abs(nearest.x - target)) nearest = p;
      if (Math.abs(nearest.x - target) > 15 * 60 * 1000) { el.textContent = ""; return; }
      const diff = latest.playing - nearest.y;
      if (diff === 0) {
        el.textContent = "no change in 1h";
        el.className = "normal-case tracking-normal font-semibold text-slate-400";
      } else {
        el.textContent = `${diff > 0 ? "▲ +" : "▼ −"}${fmt(Math.abs(diff))} in 1h`;
        el.className = "normal-case tracking-normal font-semibold " + (diff > 0 ? "text-emerald-400" : "text-rose-400");
      }
    }

    async function loadHistory() {
      try {
        const res = await fetch(Tracker.CONFIG.history("1d"), { cache: "no-store" });
        const payload = await res.json();
        history = ((payload.series && payload.series[game.slug]) || []).map((row) => ({ x: new Date(row.t).getTime(), y: row.playing }));
      } catch (error) {
        console.error("History request failed:", error);
      }
      paintSpark();
    }

    Tracker.onLive(paintLive);
    Tracker.every(() => { Tracker.loadLive(); loadHistory(); });
  }
})();
</script>
</body>
</html>
