name: Update data and deploy

on:
  repository_dispatch:
    types: [ping]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html 404.html games.html groups.html compare.html lookup.html lookup.js group-lookup.html group-lookup.js site.js group-page.js site.css tailwind-config.js rebirth-logo.svg _site/
          cp favicon.ico favicon.png favicon-32.png apple-touch-icon.png _site/
          cp -r assets _site/assets && rm -f _site/assets/README.md
          cp scripts/config.static.js _site/config.js

      - name: Generate game and group pages
        run: node scripts/sync-games.mjs
        env:
          OUT_DIR: _site

      - name: Collect data
        run: node scripts/collect.mjs
        env:
          OUT_DIR: _site
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Collect group data
        run: node scripts/collect-groups.mjs
        env:
          OUT_DIR: _site
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Collect game passes, developer products and badges
        run: node scripts/collect-extras.mjs
        env:
          OUT_DIR: _site
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Pages identifies deployments by the event's commit SHA. Advance main
      # after each dispatch so the next one uses a distinct deployment version.
      - name: Advance SHA for the next scheduled deployment
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'Refresh Pages data [skip ci]'
          git push origin HEAD:main

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
