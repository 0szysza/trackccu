name: BGSI Discord notifications

on:
  repository_dispatch:
    types: [ping]
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bgsi-alerts.yml'
      - '.github/bgsi-webhooks.json'
      - 'scripts/bgsi-alerts/**'
      - 'shared/bgsi-embeds.mjs'
      - 'shared/discord-webhook.mjs'
      - 'site.css'

permissions:
  contents: write

concurrency:
  group: bgsi-discord-alerts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test change detection and delivery
        run: node --test scripts/bgsi-alerts/test/*.test.mjs
      - name: Check BGSI and persist new notifications
        id: check
        run: node scripts/bgsi-alerts/main.mjs --prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BGSI_UPDATES_WEBHOOK: ${{ secrets.BGSI_UPDATES_WEBHOOK }}
          BGSI_EVENTS_WEBHOOK: ${{ secrets.BGSI_EVENTS_WEBHOOK }}
          BGSI_PASSES_WEBHOOK: ${{ secrets.BGSI_PASSES_WEBHOOK }}
          BGSI_PRODUCTS_WEBHOOK: ${{ secrets.BGSI_PRODUCTS_WEBHOOK }}
          BGSI_PLACE_HISTORY_API_KEY: ${{ secrets.BGSI_PLACE_HISTORY_API_KEY }}
      - name: Install update image renderer
        if: steps.check.outputs.has_update_images == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: npm ci --prefix scripts/bgsi-alerts --no-audit --no-fund
      - name: Install Chromium
        if: steps.check.outputs.has_update_images == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: scripts/bgsi-alerts/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify update image rendering
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node scripts/bgsi-alerts/preview.mjs
      - name: Send update images and embeds
        if: steps.check.outputs.has_notifications == 'true'
        run: node scripts/bgsi-alerts/main.mjs --deliver
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BGSI_UPDATES_WEBHOOK: ${{ secrets.BGSI_UPDATES_WEBHOOK }}
          BGSI_EVENTS_WEBHOOK: ${{ secrets.BGSI_EVENTS_WEBHOOK }}
          BGSI_PASSES_WEBHOOK: ${{ secrets.BGSI_PASSES_WEBHOOK }}
          BGSI_PRODUCTS_WEBHOOK: ${{ secrets.BGSI_PRODUCTS_WEBHOOK }}
