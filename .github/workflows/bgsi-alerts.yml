name: BGSI Discord image notifications

on:
  repository_dispatch:
    types: [ping]
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bgsi-alerts.yml'
      - '.github/bgsi-webhooks.json'
      - 'scripts/bgsi-alerts/**'
      - 'site.css'

permissions:
  contents: write

concurrency:
  group: bgsi-discord-alerts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test change detection and delivery
        run: node --test scripts/bgsi-alerts/test/*.test.mjs
      - name: Check BGSI and persist new notifications
        id: check
        run: node scripts/bgsi-alerts/main.mjs --prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BGSI_UPDATES_WEBHOOK: ${{ secrets.BGSI_UPDATES_WEBHOOK }}
          BGSI_EVENTS_WEBHOOK: ${{ secrets.BGSI_EVENTS_WEBHOOK }}
          BGSI_PASSES_WEBHOOK: ${{ secrets.BGSI_PASSES_WEBHOOK }}
          BGSI_PRODUCTS_WEBHOOK: ${{ secrets.BGSI_PRODUCTS_WEBHOOK }}
      - name: Install image renderer
        if: steps.check.outputs.has_notifications == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: npm ci --prefix scripts/bgsi-alerts --no-audit --no-fund
      - name: Cache Chromium
        if: steps.check.outputs.has_notifications == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: bgsi-chromium-${{ runner.os }}-${{ hashFiles('scripts/bgsi-alerts/package-lock.json') }}
      - name: Install Chromium and fonts
        if: steps.check.outputs.has_notifications == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: scripts/bgsi-alerts/node_modules/.bin/playwright install --with-deps chromium
      - name: Render four notification previews
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node scripts/bgsi-alerts/preview.mjs
        env:
          ALERT_TIME_ZONE: Europe/Berlin
      - name: Send PNG images with everyone mentions
        if: steps.check.outputs.has_notifications == 'true'
        run: node scripts/bgsi-alerts/main.mjs --deliver
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BGSI_UPDATES_WEBHOOK: ${{ secrets.BGSI_UPDATES_WEBHOOK }}
          BGSI_EVENTS_WEBHOOK: ${{ secrets.BGSI_EVENTS_WEBHOOK }}
          BGSI_PASSES_WEBHOOK: ${{ secrets.BGSI_PASSES_WEBHOOK }}
          BGSI_PRODUCTS_WEBHOOK: ${{ secrets.BGSI_PRODUCTS_WEBHOOK }}
          ALERT_TIME_ZONE: Europe/Berlin
      - name: Save generated notification images
        if: always() && (steps.check.outputs.has_notifications == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: bgsi-notification-images
          path: _bgsi-alert-images/*.png
          if-no-files-found: ignore
          retention-days: 3
