<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d17">
  <title>Offline | TrackCCU</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0b0d17;color:#f3f4f6;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100% - 48px,400px);text-align:center}
    img{width:72px;height:72px;border-radius:18px}
    h1{margin:18px 0 8px;font-size:26px;letter-spacing:-.03em}
    p{margin:0 0 24px;color:#9ca3af}
    button{border:1px solid #22d3ee;border-radius:11px;background:#0b2530;color:#b5f3ff;padding:13px 24px;font-weight:650;cursor:pointer}
    button:focus-visible{outline:2px solid #a5f3fc;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <img src="./apple-touch-icon.png" width="72" height="72" alt="">
    <h1>You're offline</h1>
    <p>TrackCCU needs an internet connection to show current Roblox player counts. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
