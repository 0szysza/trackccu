<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCU Tracker | Groups</title>
<meta name="description" content="Live member counts and history for tracked Roblox groups.">
<meta name="theme-color" content="#34BFE5">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body class="min-h-screen flex flex-col bg-roblox-darkBg text-slate-100 antialiased selection:bg-roblox-bgs selection:text-black">
<div id="site-header"></div>
<main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
  <section class="flex flex-wrap items-end justify-between gap-x-8 gap-y-4">
    <div><h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">Groups</h1><p class="text-sm text-slate-400 mt-1">Roblox groups behind the games we track. Member counts refresh every 5 minutes.</p></div>
    <dl class="flex items-stretch gap-3">
      <div class="bg-roblox-cardBg border border-roblox-cardBorder rounded-xl px-4 py-2.5"><dt class="text-xs text-slate-400">Members right now</dt><dd id="totalMembers" class="text-lg font-extrabold text-white tabular-nums">—</dd></div>
      <div class="bg-roblox-cardBg border border-roblox-cardBorder rounded-xl px-4 py-2.5"><dt class="text-xs text-slate-400">Groups tracked</dt><dd id="groupCount" class="text-lg font-extrabold text-white tabular-nums">—</dd></div>
    </dl>
  </section>
  <section class="flex flex-wrap gap-3 items-center">
    <label class="flex-1 min-w-[230px] flex items-center gap-2 bg-slate-900 border border-roblox-cardBorder rounded-xl px-3.5 py-2.5 text-slate-500 focus-within:border-roblox-bgs">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon ui-icon-md icon-accent" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
      <input id="search" type="search" class="bg-transparent outline-none text-sm text-slate-200 placeholder-slate-500 w-full" placeholder="Search groups…" aria-label="Search groups" autocomplete="off">
    </label>
    <button id="sortToggle" type="button" aria-pressed="false" class="shrink-0 flex items-center gap-2 bg-slate-900 border border-roblox-cardBorder hover:border-slate-500 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-slate-300 hover:text-white transition" title="Reverse sort order"><svg id="sortIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16m0 0-3.5-3.5M7 20l3.5-3.5M17 20V4m0 0 3.5 3.5M17 4l-3.5 3.5"/></svg><span id="sortLabel">Most members</span></button>
  </section>
  <section id="tiles" class="grid grid-cols-1 lg:grid-cols-2 gap-6" aria-label="Tracked groups"></section>
  <p id="emptyState" class="hidden text-center text-sm text-slate-500 py-10">No groups match your search.</p>
</main>
<div id="site-footer"></div>
<script src="config.js"></script><script src="site.js"></script>
<script>
(() => {
  "use strict";
  const { GROUP_CATALOG, $, fmt, iconFallback, verifiedBadgeHtml, ROOT } = Tracker;
  Tracker.mountChrome("groups");
  $("groupCount").textContent = String(GROUP_CATALOG.length);
  let latest = new Map(), history = new Map(), sortAsc = false;
  const HOUR = 3600000, DAY = 86400000;

  function trend(points, members, span, label, tolerance) {
    if (!points.length || !Number.isFinite(members)) return "";
    const target = Date.now() - span;
    let nearest = points[0];
    for (const point of points) if (Math.abs(point.x - target) < Math.abs(nearest.x - target)) nearest = point;
    if (Math.abs(nearest.x - target) > tolerance) return "";
    const delta = members - nearest.y;
    const color = delta > 0 ? "text-emerald-400" : delta < 0 ? "text-rose-400" : "text-slate-400";
    return `<span class="${color} normal-case tracking-normal font-semibold text-right${delta === 0 ? " trend-flat" : ""}">${delta === 0 ? Tracker.zeroTrendHtml : `${delta > 0 ? "▲ +" : "▼ −"}${fmt(Math.abs(delta))} in ${label}`}</span>`;
  }
  function spark(points, id) {
    if (points.length < 2) return `<div class="h-full flex items-center justify-center text-xs text-slate-500">Collecting history…</div>`;
    const W = 300, H = 64, minX = Date.now() - DAY;
    const ys = points.map((point) => point.y), low = Math.min(...ys), high = Math.max(...ys);
    const margin = (high - low) * .15 || high * .1 || 1, minY = Math.max(0, low - margin), maxY = high + margin;
    const x = (stamp) => Math.min(W, Math.max(0, (stamp - minX) / DAY * W));
    const y = (value) => 5 + 54 * (1 - (value - minY) / (maxY - minY));
    const path = points.map((point, i) => `${i ? "L" : "M"}${x(point.x).toFixed(1)} ${y(point.y).toFixed(1)}`).join(" ");
    const first = points[0], last = points.at(-1), gid = `group-gradient-${id}`;
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00f0ff" stop-opacity=".32"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></linearGradient></defs><path d="${path} L${x(last.x)} ${H} L${x(first.x)} ${H} Z" fill="url(#${gid})"/><path d="${path}" fill="none" stroke="#00f0ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg><span class="spark-dot" style="--accent:#00f0ff;--rgb:0,240,255;left:${(x(last.x) / W * 100).toFixed(2)}%;top:${(y(last.y) / H * 100).toFixed(2)}%"></span>`;
  }
  function stat(label, value, icon) {
    return `<div class="bg-slate-900/60 p-2 rounded-lg border border-slate-800/40"><span class="text-slate-400 block mb-0.5">${icon}${label}</span><span class="font-bold text-slate-200 tabular-nums">${fmt(value)}</span></div>`;
  }
  const membersIcon = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon icon-accent mr-1" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>';
  const visitsIcon = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon icon-accent mr-1" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>';
  const favoritesIcon = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon icon-warm mr-1" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>';
  function render() {
    const q = $("search").value.trim().toLowerCase();
    const ranked = GROUP_CATALOG.filter((group) => group.label.toLowerCase().includes(q)).sort((a, b) => sortAsc ? (latest.get(a.id)?.members ?? -1) - (latest.get(b.id)?.members ?? -1) : (latest.get(b.id)?.members ?? -1) - (latest.get(a.id)?.members ?? -1));
    $("emptyState").classList.toggle("hidden", ranked.length > 0);
    $("tiles").innerHTML = ranked.map((group) => {
      const data = latest.get(group.id), points = history.get(group.id) || [];
      const href = `${ROOT}groups/${group.id}/`;
      return `<article class="game-card games-card group-card tile tile-clickable bg-roblox-cardBg rounded-2xl flex flex-col overflow-hidden" data-href="${href}" role="link" tabindex="0" aria-label="Open ${group.label}'s page" style="--accent:#00f0ff;--rgb:0,240,255">
        <div class="games-card-header group-card-header flex items-start justify-between"><div class="games-card-main flex items-start min-w-0 flex-1"><img src="${data?.iconUrl || iconFallback}" alt="${group.label} icon" class="tile-icon games-card-icon object-cover bg-slate-900 shrink-0" onerror="this.onerror=null;this.src='${iconFallback}'"><div class="games-card-title min-w-0 flex-1"><h2 class="text-lg sm:text-xl font-bold text-white leading-snug break-words">${group.label}${verifiedBadgeHtml(data?.hasVerifiedBadge)}</h2><a href="${group.url}" target="_blank" rel="noopener" data-stop="1" class="tile-link text-xs text-slate-300 inline-flex items-center gap-1 mt-1.5 transition-colors">Open on Roblox <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></a></div></div></div>
        <div class="games-card-stats bg-slate-900/80 rounded-xl p-4 border border-slate-800"><div class="games-card-stats-head flex justify-between items-start gap-2 text-xs text-slate-400 font-medium uppercase tracking-wider"><span>Members in group</span><span class="games-card-trends flex flex-col items-end gap-1">${trend(points,data?.members,HOUR,"1h",15*60000)}${trend(points,data?.members,DAY,"24h",20*60000)}</span></div><div class="tile-ccu text-3xl sm:text-4xl font-extrabold tracking-tight tabular-nums mt-1">${fmt(data?.members)}</div><div class="mt-3"><div class="spark">${spark(points,group.id)}</div><div class="flex justify-between text-[10px] text-slate-500 mt-1"><span>24h ago</span><span>now</span></div></div></div>
        <div class="games-card-metrics group-card-metrics grid grid-cols-3 gap-2 pt-3 border-t border-slate-800/80 text-xs">${stat("Members",data?.members,membersIcon)}${stat("Total visits",data?.totalVisits,visitsIcon)}${stat("Total favourites",data?.totalFavorites,favoritesIcon)}</div>
      </article>`;
    }).join("");
  }
  $("search").addEventListener("input", render);
  $("sortToggle").addEventListener("click", () => { sortAsc = !sortAsc; $("sortToggle").setAttribute("aria-pressed", String(sortAsc)); $("sortIcon").style.transform = sortAsc ? "scaleY(-1)" : ""; $("sortLabel").textContent = sortAsc ? "Fewest members" : "Most members"; render(); });
  $("tiles").addEventListener("click", (event) => { const tile = event.target.closest("[data-href]"); if (tile && !event.target.closest('[data-stop="1"]')) location.href = tile.dataset.href; });
  $("tiles").addEventListener("keydown", (event) => { const tile = event.target.closest("[data-href]"); if (tile && (event.key === "Enter" || event.key === " ") && !event.target.closest('[data-stop="1"]')) { event.preventDefault(); location.href = tile.dataset.href; } });
  Tracker.onGroups((payload) => { latest = new Map((payload.groups || []).map((group) => [String(group.id), group])); $("totalMembers").textContent = fmt([...latest.values()].reduce((sum, group) => sum + (group.members || 0), 0)); render(); });
  async function loadHistory() {
    try { const response = await fetch(Tracker.CONFIG.groupsHistory("1d"), { cache: "no-store" }); if (!response.ok) throw new Error(`HTTP ${response.status}`); const payload = await response.json(); history = new Map(GROUP_CATALOG.map((group) => [group.id, (payload.series?.[group.id] || []).map((row) => ({ x: Date.parse(row.t), y: row.members }))])); render(); }
    catch (error) { console.error("Group history request failed:", error); }
  }
  render();
  Tracker.every(() => { Tracker.loadLive(); Tracker.loadGroups(); loadHistory(); });
})();
</script>
</body>
</html>
