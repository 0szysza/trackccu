<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d17">
  <title>Page not found | CCU Tracker</title>
  <script>
    const parts = location.pathname.split("/").filter(Boolean);
    const siteRoot = location.hostname.endsWith("github.io") && parts.length ? `/${parts[0]}/` : "/";
    const base = document.createElement("base");
    base.href = siteRoot;
    document.head.append(base);
  </script>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; }
    body { display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;background:#0b0d17;color:#f8fafc;font-family:Inter,system-ui,sans-serif; }
    main { width:min(100%,560px);text-align:center; }
    .brand { display:inline-flex;align-items:center;gap:10px;margin-bottom:26px;color:#cbd5e1;font-size:.9rem;font-weight:800;letter-spacing:-.02em; }
    .brand img { display:block;width:38px;height:38px;object-fit:contain; }
    .code { margin:0;color:#f8fafc;font-size:clamp(5rem,14vw,8rem);font-weight:800;letter-spacing:-.08em;line-height:1; }
    h1 { margin:18px 0 0;font-size:clamp(1.5rem,4vw,2rem);font-weight:800;letter-spacing:-.035em; }
    p { margin:10px 0 0;color:#94a3b8;font-size:.95rem;line-height:1.6; }
    a { display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:28px;padding:10px 17px;border:1px solid #33425f;border-radius:11px;background:#1a2338;color:#f8fafc;font-size:.85rem;font-weight:700;text-decoration:none;transition:border-color .15s ease,background .15s ease; }
    a:hover { border-color:#34bfe5;background:#202d46; }
    a:focus-visible { outline:2px solid #34bfe5;outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="favicon.png" alt=""><span>CCU Tracker</span></div>
    <div class="code" aria-hidden="true">404</div>
    <h1>Page not found</h1>
    <p>We couldn't find the page you're looking for.</p>
    <a href="./">Back to home</a>
  </main>
</body>
</html>
