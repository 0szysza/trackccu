<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCU Tracker | Games</title>
<meta name="description" content="Track any Roblox Game CCU and Stats!">
<meta name="theme-color" content="#34BFE5">
<meta property="og:type" content="website">
<meta property="og:title" content="CCU Tracker - Games">
<meta property="og:description" content="Track any Roblox Game CCU and Stats!">
<meta property="og:image" content="favicon.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind-config.js"></script>

<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-straight/css/uicons-regular-straight.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="site.css">
</head>
<body class="min-h-screen flex flex-col bg-roblox-darkBg text-slate-100 antialiased selection:bg-roblox-bgs selection:text-black">

<div id="site-header"></div>

<main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

  <section class="flex flex-wrap items-end justify-between gap-x-8 gap-y-4">
    <div>
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">Games</h1>
      <p class="text-sm text-slate-400 mt-1">Every game tracked here, live. Player counts refresh every 5 minutes.</p>
    </div>
    <dl class="flex items-stretch gap-3">
      <div class="bg-roblox-cardBg border border-roblox-cardBorder rounded-xl px-4 py-2.5">
        <dt class="text-xs text-slate-400">Players right now</dt>
        <dd class="text-lg font-extrabold text-white tabular-nums" id="totalPlayers">—</dd>
      </div>
      <div class="bg-roblox-cardBg border border-roblox-cardBorder rounded-xl px-4 py-2.5">
        <dt class="text-xs text-slate-400">Games tracked</dt>
        <dd class="text-lg font-extrabold text-white tabular-nums" id="gameCount">—</dd>
      </div>
    </dl>
  </section>

  <!-- Search + sort -->
  <section class="flex flex-wrap items-center gap-3">
    <div class="flex-1 min-w-[220px] flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 focus-within:border-slate-500 transition">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon ui-icon-md icon-accent" aria-hidden="true" ><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
      <input type="text" id="search" class="bg-transparent outline-none text-sm text-slate-200 placeholder-slate-500 w-full"
             placeholder="Search by name or abbreviation…" autocomplete="off" aria-label="Search games">
    </div>
    <button type="button" id="sortToggle" aria-pressed="false"
            class="shrink-0 flex items-center gap-2 bg-slate-900 border border-roblox-cardBorder hover:border-slate-500 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-slate-300 hover:text-white transition"
            title="Reverse sort order">
      <svg id="sortIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="transition-transform">
        <path d="M7 4v16m0 0-3.5-3.5M7 20l3.5-3.5M17 20V4m0 0 3.5 3.5M17 4l-3.5 3.5"/>
      </svg>
      <span id="sortLabel">Most players</span>
    </button>
  </section>

  <div id="notice" class="hidden bg-amber-400/10 border border-amber-400/30 text-amber-200 text-sm rounded-xl px-4 py-3"></div>

  <section id="tiles" class="grid grid-cols-1 md:grid-cols-2 gap-6" aria-label="Tracked games"></section>
  <p id="emptyState" class="hidden text-center text-sm text-slate-500 py-10">No games match your search.</p>

</main>

<div id="site-footer"></div>

<script src="config.js"></script>
<script src="site.js"></script>
<script>
(() => {
  "use strict";

  const { CATALOG, $, fmt, setText, iconFor, iconFallback, ROOT } = Tracker;
  Tracker.mountChrome("games");

  const HOUR = 3600 * 1000;
  const DAY = 24 * HOUR;

  /* ---------- tiles ---------- */

  const statCell = (id, label, iconHtml) => `
    <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-800/40">
      <span class="text-slate-400 block mb-0.5">${iconHtml}${label}</span>
      <span class="font-bold text-slate-200 tabular-nums" id="${id}">—</span>
    </div>`;

  function tileHtml(game) {
    const s = game.slug;
    const href = `${ROOT}games/${game.placeId}/`;
    return `
    <article class="game-card tile tile-clickable bg-roblox-cardBg rounded-2xl p-5 sm:p-6 flex flex-col gap-4 overflow-hidden"
             id="tile-${s}" data-slug="${s}" data-href="${href}" role="link" tabindex="0"
             aria-label="Open ${game.label}'s page"
             style="--accent:${game.accent};--rgb:${game.rgb};--thumb:url('${ROOT}assets/${s}-thumbnail.png')">
      <div class="art"></div>

      <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-4 min-w-0">
          <img id="icon-${s}" src="${iconFor(s)}" alt="${game.label} icon"
               data-fallback="0"
               class="tile-icon w-16 h-16 rounded-xl object-cover shadow-md bg-slate-900 shrink-0">
          <div class="min-w-0">
            <span class="tile-tag game-short-tag text-xs font-semibold uppercase tracking-wider px-2.5 py-0.5 rounded-full">${game.short}</span>
            <h2 id="name-${s}" class="text-lg sm:text-xl font-bold mt-1 text-white drop-shadow leading-snug break-words" title="${game.label}">${game.label}</h2>
            <a href="${game.url}" target="_blank" rel="noopener" data-stop="1"
               class="tile-link text-xs text-slate-300 inline-flex items-center gap-1 mt-0.5 transition-colors">
              Open on Roblox <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon" aria-hidden="true" ><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
            </a>
          </div>
        </div>
        <span id="rating-${s}" class="hidden shrink-0 items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-lg bg-slate-900/80 border border-slate-800 text-slate-200" title="Roblox like ratio">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon tile-accent" aria-hidden="true" ><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/><path d="M7 10v12"/></svg>
          <span id="ratingValue-${s}">—</span>
        </span>
      </div>

      <div class="bg-slate-900/80 rounded-xl p-4 border border-slate-800 backdrop-blur-sm">
        <div class="flex justify-between items-center gap-2 text-xs text-slate-400 font-medium uppercase tracking-wider">
          <span>Players in game</span>
          <span id="trend-${s}" class="normal-case tracking-normal font-semibold"></span>
        </div>
        <div class="tile-ccu text-3xl sm:text-4xl font-extrabold tracking-tight tabular-nums mt-1" id="ccu-${s}">—</div>
        <div class="mt-3">
          <div class="spark" id="spark-${s}"></div>
          <div class="flex justify-between text-[10px] text-slate-500 mt-1">
            <span>24h ago</span><span>now</span>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-3 border-t border-slate-800/80 text-xs">
        ${statCell("peak24-" + s, "24h peak", `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon tile-accent mr-1" aria-hidden="true" ><path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/></svg>`)}
        ${statCell("peak7-" + s, "7d peak", `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon icon-warm mr-1" aria-hidden="true" ><path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/></svg>`)}
        ${statCell("visits-" + s, "Visits", `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon tile-accent mr-1" aria-hidden="true" ><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>`)}
        ${statCell("favs-" + s, "Favourites", `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon icon-warm mr-1" aria-hidden="true" ><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>`)}
      </div>
    </article>`;
  }

  $("tiles").innerHTML = CATALOG.map(tileHtml).join("");
  $("gameCount").textContent = String(CATALOG.length);

  // Icon fallback chain: live Roblox icon -> local asset -> generic site icon.
  document.querySelectorAll("#tiles img.tile-icon").forEach((img) => {
    img.addEventListener("error", () => {
      const step = Number(img.dataset.fallback || "0");
      if (step === 0) { img.dataset.fallback = "1"; img.src = `${ROOT}assets/${img.closest("[data-slug]").dataset.slug}-icon.png`; }
      else { img.src = iconFallback; }
    });
  });

  // Whole tile navigates to that game's page; the "Open on Roblox" link
  // (and anything else marked data-stop) opens on its own instead.
  document.querySelectorAll(".tile-clickable").forEach((tile) => {
    const go = () => { window.location.href = tile.dataset.href; };
    tile.addEventListener("click", (event) => {
      if (event.target.closest('[data-stop="1"]')) return;
      go();
    });
    tile.addEventListener("keydown", (event) => {
      if ((event.key === "Enter" || event.key === " ") && !event.target.closest('[data-stop="1"]')) {
        event.preventDefault();
        go();
      }
    });
  });

  /* ---------- search + sort ---------- */

  const searchInput = $("search");
  const sortToggle = $("sortToggle");
  const sortIcon = $("sortIcon");
  const sortLabel = $("sortLabel");
  const emptyState = $("emptyState");

  let sortAsc = false; // false = most players first (default)
  let query = "";

  function applyFilterSort() {
    const q = query.trim().toLowerCase();
    const ranked = CATALOG
      .map((game) => ({
        game,
        matches: !q || game.label.toLowerCase().includes(q) || game.short.toLowerCase().includes(q),
        playing: latest.get(game.slug)?.playing ?? -1,
      }))
      .filter((row) => row.matches)
      .sort((a, b) => (sortAsc ? a.playing - b.playing : b.playing - a.playing));

    let visibleCount = 0;
    for (const game of CATALOG) {
      const tile = $("tile-" + game.slug);
      const rank = ranked.findIndex((row) => row.game.slug === game.slug);
      const visible = rank !== -1;
      tile.classList.toggle("tile-hidden", !visible);
      if (visible) { tile.style.order = String(rank); visibleCount++; }
    }
    emptyState.classList.toggle("hidden", visibleCount > 0);
  }

  searchInput.addEventListener("input", () => {
    query = searchInput.value;
    applyFilterSort();
  });

  sortToggle.addEventListener("click", () => {
    sortAsc = !sortAsc;
    sortToggle.setAttribute("aria-pressed", String(sortAsc));
    sortIcon.style.transform = sortAsc ? "scaleY(-1)" : "";
    sortLabel.textContent = sortAsc ? "Fewest players" : "Most players";
    applyFilterSort();
  });

  /* ---------- live numbers ---------- */

  let latest = new Map(); // slug -> live game payload

  function paintLive(payload) {
    latest = new Map((payload.games || []).map((game) => [game.slug, game]));

    for (const game of CATALOG) {
      const s = game.slug;
      const data = latest.get(s);
      if (!data) continue;

      setText($("ccu-" + s), fmt(data.playing));
      $("peak24-" + s).textContent = fmt(data.peak24h);
      $("peak7-" + s).textContent = fmt(data.peak7d);
      $("visits-" + s).textContent = fmt(data.visits);
      $("favs-" + s).textContent = fmt(data.favorites);

      const rating = $("rating-" + s);
      if (typeof data.ratingPercent === "number") {
        $("ratingValue-" + s).textContent = data.ratingPercent + "%";
        rating.classList.remove("hidden");
        rating.classList.add("inline-flex");
      }

      // The icon and name follow whatever the game currently uses on Roblox;
      // the local file / catalog label are only the fallback.
      if (data.iconUrl) $("icon-" + s).src = data.iconUrl;
      if (data.liveName) {
        $("name-" + s).textContent = data.liveName;
        $("name-" + s).title = data.liveName;
      }
    }

    $("totalPlayers").textContent = fmt(payload.totalPlaying);
    if (payload.source === "database") {
      $("notice").textContent = payload.warning || "Roblox did not respond — showing the last stored reading.";
      $("notice").classList.remove("hidden");
    } else {
      $("notice").classList.add("hidden");
    }

    paintTrends();
    applyFilterSort();
  }

  /* ---------- 24h sparklines + 1h trend ---------- */

  let history = new Map(); // slug -> [{ x, y }]

  function sparkline(points, game) {
    const W = 300, H = 64, PAD = 5;
    const minX = Date.now() - DAY;
    const ys = points.map((p) => p.y);
    const lo = Math.min(...ys), hi = Math.max(...ys);
    const margin = (hi - lo) * 0.15 || hi * 0.1 || 1;
    const yMin = Math.max(0, lo - margin), yMax = hi + margin;

    const xOf = (t) => Math.min(W, Math.max(0, ((t - minX) / DAY) * W));
    const yOf = (v) => PAD + (H - PAD * 2) * (1 - (v - yMin) / (yMax - yMin));

    const line = points.map((p, i) => `${i ? "L" : "M"}${xOf(p.x).toFixed(1)} ${yOf(p.y).toFixed(1)}`).join(" ");
    const first = points[0], last = points[points.length - 1];
    const area = `${line} L${xOf(last.x).toFixed(1)} ${H} L${xOf(first.x).toFixed(1)} ${H} Z`;
    const gid = "sg-" + game.slug;

    const svg = `
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="${game.accent}" stop-opacity="0.32"/>
            <stop offset="1" stop-color="${game.accent}" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="${area}" fill="url(#${gid})"/>
        <path d="${line}" fill="none" stroke="${game.accent}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </svg>`;

    const dot = `<span class="spark-dot" style="left:${(xOf(last.x) / W * 100).toFixed(2)}%;top:${(yOf(last.y) / H * 100).toFixed(2)}%"></span>`;
    return svg + dot;
  }

  function paintSparks() {
    for (const game of CATALOG) {
      const host = $("spark-" + game.slug);
      const points = history.get(game.slug) || [];
      host.innerHTML = points.length >= 2
        ? sparkline(points, game)
        : `<div class="h-full flex items-center justify-center text-xs text-slate-500">Collecting history…</div>`;
    }
    paintTrends();
  }

  // Change over the last hour: the live count against the stored reading
  // closest to one hour ago (needs at least ~an hour of history).
  function paintTrends() {
    for (const game of CATALOG) {
      const el = $("trend-" + game.slug);
      const points = history.get(game.slug) || [];
      const data = latest.get(game.slug);
      if (!points.length || !data) { el.textContent = ""; continue; }

      const target = Date.now() - HOUR;
      let nearest = points[0];
      for (const p of points) {
        if (Math.abs(p.x - target) < Math.abs(nearest.x - target)) nearest = p;
      }
      if (Math.abs(nearest.x - target) > 15 * 60 * 1000) { el.textContent = ""; continue; }

      const diff = data.playing - nearest.y;
      if (diff === 0) {
        el.textContent = "no change in 1h";
        el.className = "normal-case tracking-normal font-semibold text-slate-400";
      } else {
        el.textContent = `${diff > 0 ? "▲ +" : "▼ −"}${fmt(Math.abs(diff))} in 1h`;
        el.className = "normal-case tracking-normal font-semibold " + (diff > 0 ? "text-emerald-400" : "text-rose-400");
      }
    }
  }

  async function loadHistory() {
    try {
      const res = await fetch(Tracker.CONFIG.history("1d"), { cache: "no-store" });
      const payload = await res.json();
      history = new Map(CATALOG.map((game) => [
        game.slug,
        ((payload.series && payload.series[game.slug]) || []).map((row) => ({ x: new Date(row.t).getTime(), y: row.playing })),
      ]));
    } catch (error) {
      console.error("History request failed:", error);
    }
    paintSparks();
  }

  applyFilterSort();
  Tracker.onLive(paintLive);
  Tracker.every(() => { Tracker.loadLive(); loadHistory(); });
})();
</script>
</body>
</html>
